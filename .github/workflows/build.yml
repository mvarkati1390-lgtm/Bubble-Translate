name: Build and publish APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore Kotlin source
        run: |
          base64 -d app/src/main/java/com/example/bubbletranslate/MainActivity.kt.xz.b64 | xz -d -c > app/src/main/java/com/example/bubbletranslate/MainActivity.kt
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleTranslate-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bubble Translate - Latest APK
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
