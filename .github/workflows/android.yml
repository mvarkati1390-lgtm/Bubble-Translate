name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore Kotlin source
        run: |
          base64 -d app/src/main/java/com/example/bubbletranslate/MainActivity.kt.gz.b64 | gzip -d > app/src/main/java/com/example/bubbletranslate/MainActivity.kt
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android APK
          body: Automatically built debug APK. Install on Android 9 or newer.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
